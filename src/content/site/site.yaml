  lead:
    lv: Vairāk nekā desmit gadus strādāju starp zīmoliem, medijiem un sabiedrību — tur, kur stāsts kļūst par uzticību.
    en: For more than a decade I have worked between brands, media and the public — where a story turns into trust.
  teaser:
    lv: Esmu sabiedrisko attiecību speciāliste ar pieredzi kultūras, tehnoloģiju un publiskajā sektorā. Ticu skaidrai valodai, rūpīgai sagatavotībai un attiecībām, kas balstītas uzticībā.
    en: I am a public relations specialist with experience across culture, technology and the public sector. I believe in clear language, careful preparation and relationships built on trust.
  bio:
    lv: |
      Esmu sabiedrisko attiecību speciāliste no Rīgas. Strādāju ar kultūras institūcijām, tehnoloģiju uzņēmumiem un publiskā sektora organizācijām, palīdzot tām runāt skaidri, cilvēcīgi un pārliecinoši.

      Mans darbs aptver visu komunikācijas ciklu — no stratēģijas un vēstījumu izstrādes līdz mediju attiecībām, pasākumiem un krīzes komunikācijai. Esmu vadījusi kampaņas, kas sasniegušas starptautisku mediju uzmanību, un veidojusi ilgstošas attiecības ar žurnālistiem Baltijā un Ziemeļvalstīs.

      Ārpus darba lasu esejas, apmeklēju laikmetīgās mākslas izstādes un vadu nelielu semināru ciklu jaunajiem komunikācijas speciālistiem.
    en: |
      I am a public relations specialist based in Riga. I work with cultural institutions, technology companies and public sector organisations, helping them speak clearly, humanly and convincingly.

      My work spans the full communication cycle — from strategy and messaging to media relations, events and crisis communication. I have led campaigns that earned international media attention and built lasting relationships with journalists across the Baltics and the Nordics.

      Outside work I read essays, visit contemporary art exhibitions and run a small seminar series for emerging communication professionals.
  principles:
    - title: { lv: Skaidrība pirms skaļuma, en: Clarity before volume }
      text:
        lv: Labākais vēstījums ir tas, ko var atkārtot vienā teikumā. Vispirms skaidrība, tad izplatīšana.
        en: The best message is one that can be repeated in a single sentence. Clarity first, reach second.
    - title: { lv: Attiecības, nevis kontakti, en: Relationships, not contacts }
      text:
        lv: Mediju attiecības balstās uzticībā, ko veido godīgums, precizitāte un cieņa pret žurnālista laiku.
        en: Media relations rest on trust — built through honesty, accuracy and respect for a journalist's time.
    - title: { lv: Pierādījumi, nevis pieņēmumi, en: Evidence, not assumptions }
      text:
        lv: Katru kampaņu sāku ar auditorijas izpēti un beidzu ar godīgu rezultātu analīzi.
        en: I start every campaign with audience research and end it with an honest analysis of results.
    - title: { lv: Sagatavotība krīzē, en: Prepared for the unexpected }
      text:
        lv: Reputācija tiek aizsargāta pirms krīzes — ar scenārijiem, vēstījumu bankām un skaidru lēmumu ķēdi.
        en: Reputation is protected before a crisis — with scenarios, message banks and a clear chain of decisions.
