    Zaļā Osta vēlējās mainīt priekšstatu par sevi — no rūpnieciskas teritorijas uz modernu, atbildīgu kaimiņu pilsētai.
  en: |
    Zaļā Osta wanted to change how it was perceived — from an industrial zone to a modern, responsible neighbour to the city.
challenge:
  lv: |
    Iedzīvotāju uzticība bija zema, un ilgtspējas apgalvojumi bez pierādījumiem riskēja izskatīties pēc zaļās mazgāšanas.
  en: |
    Public trust was low, and sustainability claims without proof risked looking like greenwashing.
strategy:
