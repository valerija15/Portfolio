overview:
  lv: |
    Nordlys Design House vēlējās ienākt Baltijas tirgū nevis ar reklāmu, bet ar stāstu. Mūsu uzdevums bija izveidot zīmola pirmo iespaidu — caur medijiem, dizaina kopienu un vienu neaizmirstamu vakaru.
  en: |
    Nordlys Design House wanted to enter the Baltic market with a story rather than advertising. Our task was to shape the brand's first impression — through the media, the design community and one memorable evening.
challenge:
  lv: |
    Zīmols Latvijā bija praktiski nezināms, un dizaina mediju lauks ir neliels un piesātināts. Vajadzēja atrast iemeslu, kāpēc žurnālistiem par to rakstīt **tagad**.
  en: |
    The brand was virtually unknown in Latvia, and the design media landscape is small and saturated. We had to find a reason for journalists to write about it **now**.
strategy:
  lv: |
    Kampaņas centrā likām gaismu — kopīgu tēmu ziemeļu tumšajiem ziemas mēnešiem. Izstrādājām trīs vēstījumu līmeņus:

    - **Kultūras** — gaisma kā ziemeļnieku ikdienas rituāls;
    - **Dizaina** — materiāli, amatniecība un ilgtspēja;
    - **Cilvēku** — dizaineru personīgie stāsti.
  en: |
    We put light at the centre of the campaign — a shared theme for the dark northern winter months. We developed three layers of messaging:

    - **Cultural** — light as an everyday northern ritual;
    - **Design** — materials, craft and sustainability;
    - **Human** — the designers' personal stories.
execution:
  lv: |
    Organizējām slēgtu preses priekšskatījumu 40 žurnālistiem un satura veidotājiem, sagatavojām ekskluzīvas intervijas ar galveno dizaineri un izveidojām divvalodu preses komplektu. Kampaņu noslēdza publisks atklāšanas vakars Rīgā.
  en: |
    We hosted a closed press preview for 40 journalists and creators, arranged exclusive interviews with the lead designer and produced a bilingual press kit. The campaign culminated in a public launch evening in Riga.
