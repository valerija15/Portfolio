overview:
  lv: |
    Forums pulcēja 900 dalībniekus no visām Baltijas valstīm. Atbildēju par visu komunikāciju — mediju akreditāciju, runātāju stāstiem, sociālajiem tīkliem un pasākuma tiešraidēm.
  en: |
    The forum brought together 900 participants from across the Baltic states. I was responsible for all communication — media accreditation, speaker stories, social channels and live broadcasts.
challenge:
  lv: |
    Konference konkurēja ar vairākiem līdzīgiem pasākumiem reģionā, un iepriekšējā gada mediju atspoguļojums bija minimāls.
  en: |
    The conference competed with several similar events in the region, and the previous year's media coverage had been minimal.
strategy:
  lv: |
    Pārvērtām programmu stāstos: katrs runātājs kļuva par vienu jautājumu par reģiona nākotni. Mediji saņēma nevis programmu, bet tēmas.
  en: |
    We turned the programme into stories: each speaker became one question about the region's future. Media received themes, not a schedule.
execution:
  lv: |
    Izveidojām preses centru ar 45 akreditētiem žurnālistiem, ikdienas preses brīfingus un video ierakstu sēriju ar runātājiem.
  en: |
    We set up a press centre for 45 accredited journalists, daily press briefings and a video series with the speakers.
